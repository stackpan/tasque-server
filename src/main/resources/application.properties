spring.application.name=tasque-server

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tasque}
spring.datasource.username=${POSTGRES_USER:tasque}
spring.datasource.password=${POSTGRES_PASSWORD:tasquesecret}
spring.datasource.driver-class-name=org.postgresql.Driver

rsa.private-key=file:private.pem
rsa.public-key=file:public.pem

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB